version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: nature-horse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - nature-horse-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    back:
      build:
        context: .
        dockerfile: apps/back/Dockerfile
      container_name: nature-horse-back
      restart: unless-stopped
      depends_on:
        mysql:
          condition: service_healthy
      environment:
        DB_HOST: mysql
        DB_PORT: 3306
        DB_USER: root
        DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        DB_NAME: ${DB_NAME}
        DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${DB_NAME}
        JWT_SECRET: ${JWT_SECRET}
        STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
        STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
        APP_FRONTEND_URL: ${APP_FRONTEND_URL}
        APP_NAME: Nature Horse
        NODE_ENV: production

  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
    container_name: nature-horse-front
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "80:80"

volumes:
  nature-horse-mysql-data:
