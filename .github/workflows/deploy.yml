name: Test and deploy

on:
  push:
    branches: [main, dev, preprod]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: nature_horse
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Generate Prisma client
        working-directory: apps/back
        env:
          DATABASE_URL: "mysql://root:ci-root-password@127.0.0.1:3306/nature_horse"
        run: npx prisma generate

      - name: Apply migrations to the CI database
        working-directory: apps/back
        env:
          DATABASE_URL: "mysql://root:ci-root-password@127.0.0.1:3306/nature_horse"
        run: npx prisma migrate deploy

      - name: Seed the CI database
        working-directory: apps/back
        env:
          DATABASE_URL: "mysql://root:ci-root-password@127.0.0.1:3306/nature_horse"
          DB_PASSWORD: ci-root-password
        run: npx tsx prisma/seed.ts

      - name: Run back-end tests
        working-directory: apps/back
        env:
          DB_PASSWORD: ci-root-password
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Nature-Horse
            git pull origin main
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build
