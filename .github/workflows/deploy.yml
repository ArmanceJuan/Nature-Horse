name: Test and deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Generate Prisma client
        working-directory: apps/back
        env:
          DATABASE_URL: "mysql://placeholder:placeholder@localhost:3306/placeholder"
        run: npx prisma generate

      - name: Run back-end tests
        working-directory: apps/back
        env:
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Nature-Horse
            git pull origin main
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build
